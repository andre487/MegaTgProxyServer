---
- name: Validate administrative access
  ansible.builtin.assert:
    that:
      - tg_admin.user != "root"
      - tg_admin.public_key | length > 0
    fail_msg: "A non-root administrator and its public key are required"

- name: Create or update administrative user
  ansible.builtin.user:
    name: "{{ tg_admin.user }}"
    state: present
    create_home: true
    password: '!'
    update_password: on_create
    groups: sudo
    append: true
  register: tg_admin_account

- name: Create administrative SSH directory
  ansible.builtin.file:
    path: "{{ tg_admin_account.home }}/.ssh"
    state: directory
    owner: "{{ tg_admin.user }}"
    mode: "0700"

- name: Install administrative public key
  ansible.builtin.lineinfile:
    path: "{{ tg_admin_account.home }}/.ssh/authorized_keys"
    line: "{{ tg_admin.public_key }}"
    create: true
    owner: "{{ tg_admin.user }}"
    mode: "0600"
  when: tg_bootstrap_phase | default('') == 'account'
  no_log: true

- name: Replace verified administrative public key
  ansible.builtin.template:
    dest: "{{ tg_admin_account.home }}/.ssh/authorized_keys"
    src: authorized_keys.j2
    owner: "{{ tg_admin.user }}"
    mode: "0600"
  when: tg_bootstrap_phase | default('') != 'account'
  no_log: true

- name: Allow non-interactive administration through sudo
  ansible.builtin.template:
    dest: "/etc/sudoers.d/megatg-{{ tg_admin.user }}"
    src: sudoers.j2
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
