---
- name: Compute client secret
  ansible.builtin.set_fact:
    tg_secret_full: "{{ tg_secret }}"
  no_log: true

- name: Encode FakeTLS domain
  ansible.builtin.set_fact:
    tg_secret_full: "ee{{ tg_secret }}{{ tg_domain.encode('utf-8').hex() }}"
  when: tg_mode == 'faketls'
  no_log: true

- name: Create private proxy directory
  ansible.builtin.file:
    path: /etc/megatg
    state: directory
    mode: '0700'

- name: Configure SSH egress
  ansible.builtin.include_tasks: ssh.yml
  when: tg_egress == 'ssh'

- name: Install MTG config preserving imported options
  ansible.builtin.copy:
    dest: /etc/megatg/mtg.toml
    content: "{{ tg_mtg_config | replace('__MEGATG_SECRET__', tg_secret_full) }}"
    mode: '0600'
  when: tg_engine == 'mtg'
  no_log: true
  diff: false
  register: tg_config

- name: Create persistent official MTProxy data volume
  community.docker.docker_volume:
    name: "{{ tg_mtproxy_volume }}"
  when: tg_engine == 'mtproxy'

- name: Download current Telegram server protocol key
  ansible.builtin.get_url:
    url: https://core.telegram.org/getProxySecret
    dest: /etc/megatg/telegram-secret
    mode: '0600'
    timeout: 20
  when: tg_engine == 'mtproxy' and not ansible_check_mode
  register: tg_protocol_key

- name: Run Telegram proxy
  community.docker.docker_container:
    name: "{{ tg_container_name }}"
    image: "{{ tg_image }}"
    pull: missing
    state: started
    restart_policy: unless-stopped
    recreate: "{{ (tg_config.changed | default(false)) or (tg_protocol_key.changed | default(false)) }}"
    command: "{{ ['run', '/config.toml'] if tg_engine == 'mtg' else omit }}"
    network_mode: "{{ tg_network if tg_egress == 'ssh' else 'bridge' }}"
    published_ports: "{{ ['0.0.0.0:' ~ tg_port|string ~ ':' ~ ('3128' if tg_engine == 'mtg' else '443') ~ '/tcp'] + (['[::]:' ~ tg_port|string ~ ':' ~ ('3128' if tg_engine == 'mtg' else '443') ~ '/tcp'] if tg_publish_ipv6 else []) + (['127.0.0.1:3129:3129/tcp'] if tg_engine == 'mtg' else []) }}"
    volumes: "{{ ['/etc/megatg/mtg.toml:/config.toml:ro'] if tg_engine == 'mtg' else [tg_mtproxy_volume ~ ':/data', '/etc/megatg/telegram-secret:/etc/telegram/hello-explorers-how-are-you-doing:ro'] }}"
    env: "{{ {'WORKERS': tg_workers|string, 'SECRET': tg_secret} if tg_engine == 'mtproxy' else {} }}"
    log_driver: json-file
    log_options:
      max-size: 10m
      max-file: '3'
  no_log: true
  diff: false
