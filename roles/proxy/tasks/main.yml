---
- name: Remember previously deployed image for scoped cleanup
  community.docker.docker_container_info:
    name: "{{ tg_container_name }}"
  register: tg_previous_proxy
  no_log: true

- name: Compute client secret
  ansible.builtin.set_fact:
    tg_secret_full: "{{ tg_secret }}"
  no_log: true

- name: Encode FakeTLS domain
  ansible.builtin.set_fact:
    tg_secret_full: "ee{{ tg_secret }}{{ tg_domain.encode('utf-8').hex() }}"
  when: tg_mode == 'faketls'
  no_log: true

- name: Create private proxy directory
  ansible.builtin.file:
    path: /etc/megatg
    state: directory
    mode: '0700'

- name: Configure SSH egress
  ansible.builtin.include_tasks: ssh.yml
  when: tg_egress == 'ssh'

- name: Configure official MTProxy transparent egress
  ansible.builtin.include_tasks: mtproxy-egress.yml

- name: Install MTG configuration from template
  ansible.builtin.template:
    src: "{{ tg_mtg_template }}"
    dest: /etc/megatg/mtg.toml
    mode: '0600'
  when: tg_engine == 'mtg'
  no_log: true
  diff: false
  register: tg_config

- name: Create persistent official MTProxy data volume
  community.docker.docker_volume:
    name: "{{ tg_mtproxy_volume }}"
  when: tg_engine == 'mtproxy'

- name: Download current Telegram server protocol key
  ansible.builtin.get_url:
    url: https://core.telegram.org/getProxySecret
    dest: /etc/megatg/telegram-secret
    mode: '0600'
    timeout: 20
  when: tg_engine == 'mtproxy' and not ansible_check_mode
  register: tg_protocol_key

- name: Configure official MTProxy startup
  when: tg_engine == 'mtproxy'
  block:
    - name: Download Telegram backend configuration
      ansible.builtin.get_url:
        url: https://core.telegram.org/getProxyConfig
        dest: /etc/megatg/backend.conf
        mode: '0600'
        timeout: 20
      register: tg_backend_config
      when: not ansible_check_mode
    - name: Install explicit MTProxy startup
      ansible.builtin.template:
        src: mtproxy-start.sh.j2
        dest: /etc/megatg/mtproxy-start.sh
        mode: '0700'
      register: tg_mtproxy_start

- name: Build pinned official MTProxy
  ansible.builtin.include_tasks: build-mtproxy.yml
  when: tg_engine == 'mtproxy'

- name: Run Telegram proxy
  community.docker.docker_container:
    name: "{{ tg_container_name }}"
    image: "{{ tg_image }}"
    pull: missing
    state: started
    restart_policy: unless-stopped
    recreate: "{{ (tg_config.changed | default(false)) or (tg_protocol_key.changed | default(false)) or (tg_backend_config.changed | default(false)) or (tg_mtproxy_start.changed | default(false)) }}"
    command: "{{ ['run', '/config.toml'] if tg_engine == 'mtg' else ['/bin/sh', '/megatg-start.sh'] }}"
    etc_hosts: "{{ {tg_domain: tg_mtproxy_fronting_ip} if tg_engine == 'mtproxy' and tg_mode == 'faketls' and tg_mtproxy_fronting_ip is defined else {} }}"
    network_mode: "{{ tg_network if tg_egress == 'ssh' else 'bridge' }}"
    sysctls: "{{ {'net.ipv6.conf.all.disable_ipv6': '1'} if tg_engine == 'mtproxy' and tg_egress == 'ssh' else {} }}"
    published_ports: "{{ ['0.0.0.0:' ~ tg_port|string ~ ':' ~ ('3128' if tg_engine == 'mtg' else '443') ~ '/tcp'] + (['[::]:' ~ tg_port|string ~ ':' ~ ('3128' if tg_engine == 'mtg' else '443') ~ '/tcp'] if tg_publish_ipv6 else []) + (['127.0.0.1:3129:3129/tcp'] if tg_engine == 'mtg' else []) }}"
    volumes: "{{ ['/etc/megatg/mtg.toml:/config.toml:ro'] if tg_engine == 'mtg' else [tg_mtproxy_volume ~ ':/data', '/etc/megatg/telegram-secret:/etc/telegram/hello-explorers-how-are-you-doing:ro'] + ['/etc/megatg/mtproxy-start.sh:/megatg-start.sh:ro', '/etc/megatg/backend.conf:/etc/telegram/backend.conf:ro'] }}"
    env: "{{ ({'WORKERS': tg_workers|string, 'SECRET': tg_secret, 'MODE': tg_mode, 'PUBLIC_IP': tg_public_ip | default(ansible_default_ipv4.address)} | combine({'DOMAIN': tg_domain} if tg_mode == 'faketls' else {})) if tg_engine == 'mtproxy' else {} }}"
    labels:
      io.megatg.managed: "true"
    log_driver: json-file
    log_options:
      max-size: 10m
      max-file: '3'
  no_log: true
  diff: false
