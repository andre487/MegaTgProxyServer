name: Deployment

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deployment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: ${{ matrix.image }} / ${{ matrix.method }} / ${{ matrix.engine }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "images:debian/12/cloud"]
        method: [checkout, bash]
        engine: [mtg, mtproxy]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Initialize LXD
        run: |
          sudo snap install lxd --channel=5.21/stable || sudo snap refresh lxd --channel=5.21/stable
          sudo lxd waitready
          sudo lxd init --auto
      - name: Install and deploy in a clean guest
        run: tests/integration/deploy.sh '${{ matrix.image }}' '${{ matrix.method }}' '${{ matrix.engine }}'
